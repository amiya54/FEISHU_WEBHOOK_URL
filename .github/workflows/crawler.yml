name: Get Hot News

on:
  schedule:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ⚠️ 试用版说明 / Trial Mode
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 🔄 运行机制 / How it works:
    #    - 每个周期为 7 天，届时自动停止
    #    - 运行 "Check In" 会重置周期（重新开始 7 天倒计时，而非累加）
    #    - Each cycle is 7 days, then auto-stops
    #    - "Check In" resets the cycle (restarts 7-day countdown, not cumulative)
    #
    # 💡 设计初衷 / Why this design:
    #    如果 7 天都忘了签到，或许这些资讯对你来说并非刚需
    #    适时的暂停，能帮你从信息流中抽离，给大脑留出喘息的空间
    #    If you forget for 7 days, maybe you don't really need it
    #    A timely pause helps you detach from the stream and gives your mind space
    #
    # 🙏 珍惜资源 / Respect shared resources:
    #    GitHub Actions 是平台提供的公共资源，每次运行都会消耗算力
    #    签到机制确保资源分配给真正需要的用户，感谢你的理解与配合
    #    GitHub Actions is a shared public resource provided by the platform
    #    Check-in ensures resources go to those who truly need it — thank you
    #
    # 🚀 长期使用请部署 Docker 版本 / For long-term use, deploy Docker version
    #
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 📝 修改运行时间：只改第一个数字（0-59），表示每小时第几分钟运行
    # 📝 Change time: Only modify the first number (0-59) = minute of each hour
    #
    # 示例 / Examples:
    #   "15 * * * *"     → 每小时第15分钟 / minute 15 every hour
    #   "30 0-14 * * *"  → 北京时间 8:00-22:00 每小时第30分钟 / Beijing 8am-10pm
    #
    - cron: "0 0 * * 5"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  # 过刊归档需要把 archive/ 提交回仓库（否则下一期读不到上一期的台账）
  contents: write
  actions: write

jobs:
  # 隔周门控：只有偶数周的周五才继续，另一周直接跳过
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check biweekly schedule
        id: check
        run: |
          WEEK_INDEX=$(( $(date -u +%s) / 604800 ))
          if [ $((WEEK_INDEX % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 本周为发布周，继续执行双周报"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭ 本周为间隔周，跳过本次运行"
          fi

  crawl:
    needs: gate
    if: needs.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ★法规扩容改动：40 → 60 分钟。
    #   接入法规直采后单轮负载明显变重：源 22→30、7 个 Google News 源各放宽到
    #   100 条、候选池上限 450 条、首轮还要一次带入全年 77 条法规。
    #   实测 2026-10-15 首轮「Run crawler」单步就跑了 11 分钟以上，
    #   而扩容前整轮（含所有步骤）只要 4 分半 —— 40 分钟余量太薄，
    #   一旦被强杀，已消耗的 AI 调用和 token 会一起丢掉。
    timeout-minutes: 60
    outputs:
      # 供 deploy-pages 判断本次是否真的产出了可发布的网页
      pages_ready: ${{ steps.pages_prep.outputs.ready }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Check Expiration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_FILE="crawler.yml"
          API_URL="repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs"

          TOTAL=$(gh api "$API_URL" --jq '.total_count')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "No previous runs found, skipping expiration check"
            exit 0
          fi

          LAST_PAGE=$(( (TOTAL + 99) / 100 ))
          FIRST_RUN_DATE=$(gh api "$API_URL?per_page=100&page=$LAST_PAGE" --jq '.workflow_runs[-1].created_at')

          if [ -n "$FIRST_RUN_DATE" ]; then
            CURRENT_TIMESTAMP=$(date +%s)
            FIRST_RUN_TIMESTAMP=$(date -d "$FIRST_RUN_DATE" +%s)
            DIFF_SECONDS=$((CURRENT_TIMESTAMP - FIRST_RUN_TIMESTAMP))
            LIMIT_SECONDS=604800

            if [ $DIFF_SECONDS -gt $LIMIT_SECONDS ]; then
              echo "⚠️ 试用期已结束，请运行 'Check In' 签到续期"
              echo "⚠️ Trial expired. Run 'Check In' to renew."
              gh workflow disable "$WORKFLOW_FILE"
              exit 1
            else
              DAYS_LEFT=$(( (LIMIT_SECONDS - DIFF_SECONDS) / 86400 ))
              echo "✅ 试用期剩余 ${DAYS_LEFT} 天，到期前请运行 'Check In' 签到续期"
              echo "✅ Trial: ${DAYS_LEFT} days left. Run 'Check In' before expiry to renew."
            fi
          fi


      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      # - name: Random Delay (Traffic Control)
      #   if: success()
      #   run: |
      #     echo "🎲 Traffic Control: Generating random delay..."
      #     DELAY=$(( ( RANDOM % 300 )  + 1 ))
      #     echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
      #     sleep ${DELAY}s
      #     echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Apply low-carbon patches
        if: success()
        continue-on-error: true
        run: |
          # 自动识别补丁脚本位置：patches/ 子目录 或 仓库根目录 均可
          if [ -f patches/apply_patches.py ]; then
            python patches/apply_patches.py .
          elif [ -f apply_patches.py ]; then
            python apply_patches.py
          else
            echo "⚠️ 未找到 apply_patches.py，跳过补丁（不影响爬虫继续运行）"
          fi

      # --------------------------------------------------------------------------------
      # 📜 FETCH OFFICIAL REGULATIONS / 法规原文直采
      # --------------------------------------------------------------------------------
      # 解决的问题：IMO、船级社、海事局【官网全都没有 RSS】。实测结论：
      #     DNV 403 、LR 404 、ABS 404 、EUR-Lex 404 、US MARAD 403
      #     CCS / ClassNK / IMO / 中国海事局 / 交通运输部 —— 无 feed
      #   IMO 官网整站是 SharePoint 动态渲染，列表页连日期都抓不到。
      #   而资讯媒体只会「谈论」法规、不会发布法规原文 —— 所以只靠 RSS，
      #   报告里的「法规前沿」永远只有二手新闻，见不到实质性的文件。
      #
      # 这个脚本直接抓这些机构官网的公告列表页，提取「标题 + 日期 + 链接」，
      # 生成一条标准 RSS（regfeed/reg_feed.xml），下一步再喂给配置里的
      # regulations-live 源，于是官方文件就和普通 RSS 条目一样进报告。
      #
      # 覆盖：中国船级社（规范/指南/征求意见/中国海事法规/材料设备指南）
      #       中国海事局（船舶技术法规/通知公告）
      # 实测捕获量（2026-10-15 本机直连）：90天 39 条 / 180天 63 条 / 365天 77 条。
      # 用 365 天：法规有长尾效应（一条 3 月生效的规则全年都相关），
      # 而且 report.mode=incremental 会按 (feed_id, guid) 去重 ——
      # 第一次跑把全年清单一次带入，之后每期只报新增的那几条。
      #
      # ⚠️ 这些是国内站点，GitHub Actions 跑在境外。若被拦截，本步会打印
      #    「所有源都抓取失败」，报告自动退回纯 RSS 模式，不影响任何其它流程。
      #    所以这里用 continue-on-error，且脚本本身永不返回非零退出码。
      # --------------------------------------------------------------------------------
      - name: Fetch official regulations
        if: success()
        continue-on-error: true
        run: |
          python scripts/fetch_regulations.py --days 365 --out regfeed/reg_feed.xml

      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          # SMTP 登录名（仅当登录名 ≠ 发件邮箱时需要，例如 Brevo / Resend / SendGrid）
          # 留空则回退为使用 EMAIL_FROM 登录，行为与原来一致
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
          # 让 Python 日志实时刷出（默认非交互环境是块缓冲，进度会攒到进程结束
          # 才整段显示，从 Actions 页面看就像「卡住不动」）。
          PYTHONUNBUFFERED: "1"
        run: |
          # 把上一步直采生成的法规 feed 暴露成一个本地 URL 再交给爬虫。
          # 为什么要绕这一道：爬虫用的是 requests，而 requests 不支持 file://，
          # 所以必须有个真的 HTTP 地址它才读得到。
          if [ -s regfeed/reg_feed.xml ]; then
            (cd regfeed && python -m http.server 8788 --bind 127.0.0.1 >/dev/null 2>&1 &)
            sleep 2
            if curl -fsS --max-time 5 http://127.0.0.1:8788/reg_feed.xml >/dev/null 2>&1; then
              echo "✅ 法规直采源已就绪：$(grep -c '<item>' regfeed/reg_feed.xml) 条官方文件"
            else
              echo "⚠️ 法规直采源未能提供服务，本轮该源会被跳过（其余源不受影响）"
            fi
          else
            echo "⚠️ 未生成 regfeed/reg_feed.xml，本轮跳过法规直采源"
          fi
          uv run python -m trendradar

      # --------------------------------------------------------------------------------
      # 🗂️ ARCHIVE & CROSS-ISSUE TRACKING / 过刊归档 + 跨期进展跟踪
      # --------------------------------------------------------------------------------
      # 解决的问题：TrendRadar 每期把 index.html 整个覆盖，没有过刊库；
      #   双周报也只会说「这两周发生了什么」，不会说「上期提的那件事现在怎么样了」。
      #
      # 这一步在报告生成之后、发布之前跑，做三件事：
      #   1. 把本期另存为 archive/issues/<日期>.html（自包含单文件）
      #   2. 与上一期的台账比对，判定每条「计划/试验」类事项的进展
      #      （已落地 / 规则落地 / 有新进展 / 未见后续），在 AI 正文前插入一张表
      #   3. 生成 archive/index.html 过刊目录
      #
      # 台账 archive/ledger.json 只存「每期事件」，观察池由它现算 ——
      # 所以同一天重跑是覆盖而不是累积，脚本天然幂等。
      #
      # 失败不阻断：脚本退出码永远 0，报告照常发布（只是这期没有跟踪表）。
      # --------------------------------------------------------------------------------
      - name: Archive & cross-issue tracking
        if: success()
        continue-on-error: true
        run: |
          python scripts/archive_and_track.py --report index.html --archive archive

      # 把 archive/ 提交回仓库：下一期要靠它读上一期的台账和编号
      - name: Persist archive to repository
        if: success()
        continue-on-error: true
        run: |
          if [ ! -d archive ]; then
            echo "⚠️ 没有 archive/ 目录，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "📭 归档无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(archive): 归档 $(date -u +%F) 期报告与跟踪台账"
          git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)

      # --------------------------------------------------------------------------------
      # 📥 UPLOAD REPORT AS ARTIFACT / 把报告挂到本次运行记录里，可随时下载
      # --------------------------------------------------------------------------------
      # 零配置兜底：不需要任何设置，也不需要开启 Pages。
      # 每次运行结束后，到仓库的 Actions 页面点进本次运行，页面底部「Artifacts」
      # 区域会出现一个 zip，下载解压后双击 index.html 就能看完整报告。
      #
      # 保留 30 天（GitHub 默认上限 90 天，可自行改大）。
      # --------------------------------------------------------------------------------
      - name: Upload report as downloadable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: |
            index.html
            output/html/
            regfeed/reg_feed.xml
          retention-days: 30
          if-no-files-found: warn

      # --------------------------------------------------------------------------------
      # 🌐 GITHUB PAGES PUBLISH / 把网页报告发布成一个固定网址（不用邮箱）
      # --------------------------------------------------------------------------------
      # 做什么：把爬虫生成的 index.html 发布到 GitHub Pages，得到一个永久网址
      #         https://<用户名>.github.io/<仓库名>/
      #         该网址永远显示「最新一期」报告，手机浏览器打开后可「添加到主屏幕」，
      #         点开就像一个 App，不用下载、不用邮件。
      #
      # 为什么能直接放：TrendRadar 生成的 HTML 是「单文件自包含」的
      #         （CSS/JS 全部内联，无外部依赖），丢到任何静态托管都能正常显示。
      #
      # ⚠️ 前置条件（只需在网页上点一次，不用钱）：
      #     仓库 → Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
      #
      # ⚠️ 免费账户的 Pages 只能发布「公开仓库」；私有仓库需要 GitHub Pro。
      #     如果你不想把仓库设为公开，用下面那个 Cloudflare Pages 方案（私有仓库也免费）。
      #
      # 没在 Settings 里开启 Pages 时，最后的 deploy-pages 会报错提示你去做这一步，
      # 报错不影响爬虫本身，也不影响其它推送渠道。
      # --------------------------------------------------------------------------------
      - name: Prepare Pages site
        if: success()
        id: pages_prep
        run: |
          if [ ! -f index.html ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ 未找到 index.html（可能是 storage.formats.html 被关掉了），跳过 Pages 发布"
            exit 0
          fi
          rm -rf pages_dist
          mkdir -p pages_dist
          cp index.html pages_dist/index.html
          # 过刊库：archive/issues/*.html + archive/index.html
          if [ -d archive ]; then
            cp -r archive pages_dist/archive
            echo "🗂 过刊库已带上：$(find pages_dist/archive -name '*.html' | wc -l) 个页面"
          fi
          # 把历史快照一并带上，便于回看上几期
          if [ -d output/html ]; then
            cp -r output/html pages_dist/html
          fi
          # 关闭 Jekyll 处理，加快发布速度
          touch pages_dist/.nojekyll
          # 请求搜索引擎不要收录本站点（防止报告页被 Google/Bing 搜到）。
          # 注意：只能挡住守规矩的爬虫；网址若被直接转发，对方仍可打开。
          printf 'User-agent: *\nDisallow: /\n' > pages_dist/robots.txt
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "📦 待发布站点内容："
          du -sh pages_dist
          find pages_dist -name "*.html" | head -20

      - name: Upload Pages artifact
        if: success() && steps.pages_prep.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_dist

      # --------------------------------------------------------------------------------
      # ☁️ CLOUDFLARE PAGES DEPLOY / 部署到 Cloudflare Pages（可选）
      # --------------------------------------------------------------------------------
      # 将爬虫生成的 index.html 自动部署到 Cloudflare Pages，国内访问比 GitHub Pages 更快。
      # 仅当下面三个 Secrets 均已配置时才会执行，缺任意一个则自动跳过，不影响其它流程：
      #   - CLOUDFLARE_API_TOKEN     权限：Account → Cloudflare Pages → Edit
      #   - CLOUDFLARE_ACCOUNT_ID    Cloudflare 账户 ID
      #   - CLOUDFLARE_PROJECT_NAME  Cloudflare Pages 项目名（需提前在 Dashboard 创建）
      # 配置教程详见 README「自动部署到 Cloudflare Pages」章节。
      # --------------------------------------------------------------------------------
      - name: Check Cloudflare config
        if: success()
        id: cf_check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 Cloudflare 配置，准备部署到 Cloudflare Pages"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未配置 Cloudflare Secrets，跳过 Cloudflare Pages 部署"
          fi

      - name: Prepare Cloudflare Pages assets
        if: success() && steps.cf_check.outputs.enabled == 'true'
        run: |
          if [ ! -f index.html ]; then
            echo "❌ 未找到 index.html，请确认爬虫已生成网页报告"
            exit 1
          fi
          rm -rf cloudflare_dist
          mkdir -p cloudflare_dist
          cp index.html cloudflare_dist/index.html
          if [ -d archive ]; then cp -r archive cloudflare_dist/archive; fi

      - name: Deploy to Cloudflare Pages
        if: success() && steps.cf_check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}

  # ────────────────────────────────────────────────────────────────────────────────
  # 🌐 GITHUB PAGES DEPLOY / 发布网页报告
  # ────────────────────────────────────────────────────────────────────────────────
  # 为什么单独开一个 job：发布 Pages 需要 pages:write + id-token:write 权限，
  # 而爬虫 job 本身只需要 contents:read。权限拆开更安全，也符合官方推荐写法。
  #
  # 没有在 Settings → Pages 里把 Source 设为 "GitHub Actions" 时，这一步会失败，
  # 报错信息会直接告诉你缺什么，属于预期内的一次性配置，不影响爬虫运行。
  # ────────────────────────────────────────────────────────────────────────────────
  deploy-pages:
    needs: [gate, crawl]
    if: needs.crawl.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show report URL
        if: success()
        run: |
          echo "✅ 报告已发布，固定网址："
          echo "   ${{ steps.deployment.outputs.page_url }}"
          echo "   这个网址永远显示最新一期，手机可「添加到主屏幕」当作 App 使用。"


